openapi: 3.0.3
info:
  title: 通学AIラジオ API
  version: "0.1.0"
  description: |
    フロントエンド（React + Vite）とバックエンド（Go）を並行開発するための取り決め。
    **実装より先にこのファイルを更新して合意すること。** 変更したら両チームに共有する。

    - データモデルは [06-storage.md](../backend/docs/pipeline/06-storage.md) の PostgreSQL スキーマに対応する
    - 認証は行わない（ログイン機能はスコープ外。`userId` の発行方法は下記「userId の扱い」参照）。
      ローカル完結・オフライン前提の構成であり、本番公開は想定していないための割り切り

    ## CORS
    フロントエンド（`http://localhost:3000` 想定）とバックエンド（`http://localhost:8080` 想定）は
    オリジンが異なるため、バックエンドは以下の CORS レスポンスヘッダを返すこと。
    実装時に抜けやすく、抜けると疎通確認の最初の一歩で詰まるので明記しておく。

    ```
    Access-Control-Allow-Origin: http://localhost:3000
    Access-Control-Allow-Methods: GET, POST, PUT, OPTIONS
    Access-Control-Allow-Headers: Content-Type
    ```

    ## userId の扱い
    ログイン機能はスコープ外のため、次の方式で暫定的にユーザーを識別する。

    1. フロントエンドは初回起動時に `POST /api/users` を呼び、サーバーが発行した `userId`（UUID）を受け取る
    2. `userId` をブラウザの `localStorage` に保存し、以降の全リクエストで使い回す
    3. サーバーはリクエストされた `userId` が `users` テーブルに存在するかを検証し、
       存在しなければ `404`（`USER_NOT_FOUND`）を返す

    クライアントが自前で UUID を生成しない理由：`programs.user_id` が外部キー制約付きのため、
    存在しないIDでの書き込みを防ぐにはサーバー発行が確実。

    ## 表示名（ニックネーム）の扱い
    UIモック（`/mock`）ではプロフィール画面にユーザー名を表示するが、ログイン機能がスコープ外である以上
    サーバー側でアカウントに紐づく表示名を管理する意味は薄い。表示名はバックエンドAPIの対象外とし、
    フロントエンドの `localStorage` にのみ保存するクライアントローカルな値として扱う
    （どのAPIレスポンスにも `name` 相当のフィールドは含まれない）。

    ## DEMO_MODE（発表・デモ実演用）
    バックエンドの環境変数 `DEMO_MODE` を設定すると、記事取得→LLM→TTSの重い生成処理を一切実行しない
    デモ用の挙動に切り替わる（実装は`backend/internal/db/demo.go`・各ハンドラの`s.demoMode`分岐）。

    - `POST /api/batch/run`・`POST /api/demo/generate` は完全に無効化し、`503`（`DEMO_MODE_DISABLED`）を返す
    - `POST /api/users/{userId}/programs/latest/regenerate` は実生成の代わりに、
      既に`programs`テーブルにある番組の中から**そのユーザーにまだ割り当てていないもの**を1件ランダムに選び、
      新しく割り当てて返す（`demo_program_assignments`テーブルで管理。本番の`programs`/`chapters`は一切変更しない）。
      同じユーザーが繰り返し呼ぶと毎回別の番組がランダムに返るが、**そのユーザーへの割り当て候補（未使用の既存番組）が尽きると**
      `429`（`RESET_LIMIT_EXCEEDED`、通常の1日3回制限と同じレスポンス形式を流用）を返す
    - `GET /api/users/{userId}/programs/latest`・`GET /api/users/{userId}/programs` は
      `programs.user_id`ではなく`demo_program_assignments`を参照し、このユーザーに割り当て済みの番組を返す
      （`createdAt`は番組の実際の生成日時ではなく、そのユーザーへの割り当て日時になる）

servers:
  - url: http://localhost:8080
    description: ローカル開発環境（VITE_API_BASE_URL、詳細は frontend/CLAUDE.md#環境変数）

tags:
  - name: users
    description: ユーザー識別・テーマタグ・配信設定（オンボーディング・プロフィール）
  - name: programs
    description: 番組の取得・履歴・作り直し（ホーム・プレイヤー・プロフィール）
  - name: audio
    description: 音声ファイルの配信
  - name: demo
    description: ライブデモ用の軽量パイプライン
  - name: batch
    description: 毎朝のバッチ生成
  - name: health
    description: ヘルスチェック

paths:
  /api/users:
    post:
      operationId: createUser
      tags: [users]
      summary: 匿名ユーザーを作成する
      description: |
        匿名ユーザーを1件作成し、`userId` を発行する（アプリ初回起動時に呼ぶ）。
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: ユーザープロフィールを取得する（プロフィール画面）
      description: |
        プロフィール画面（テーマタグ・配信設定・統計）の初期表示に使う。フロントエンドは
        `PUT /api/users/{userId}/tags` や `PUT /api/users/{userId}/settings` を呼ぶ前に、
        まずこれで現在の設定値を取得してフォームに反映する。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: "`userId` が存在しない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: USER_NOT_FOUND
                  message: "指定されたユーザーが見つかりません"

  /api/users/{userId}/settings:
    put:
      operationId: putUserSettings
      tags: [users]
      summary: 配信時刻・番組の長さを設定する（プロフィール）
      description: |
        配信時刻とポッドキャストの長さを保存する。全件を置き換える冪等な操作のため `PUT` とする。
        `PUT /api/users/{userId}/tags` とはリソースを分けている
        （タグ＝オンボーディングで決める内容、設定＝プロフィールで後から調整する内容、と
        画面の持ち主が異なるため）。
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
            example:
              deliveryTime: "06:00"
              lengthMinutes: 10
      responses:
        "204":
          description: 保存成功（本文なし）
        "400":
          description: "`deliveryTime`が`HH:MM`形式でない、または`lengthMinutes`が許可値（5/10/15）以外"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_SETTINGS
                  message: "lengthMinutesは5・10・15のいずれかで指定してください"
        "404":
          description: "`userId` が存在しない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: USER_NOT_FOUND
                  message: "指定されたユーザーが見つかりません"

  /api/users/{userId}/tags:
    put:
      operationId: putUserTags
      tags: [users]
      summary: テーマタグを保存する（オンボーディング）
      description: |
        テーマタグを保存する（[オンボーディング](../frontend/docs/features/onboarding.md)）。
        全件を置き換える冪等な操作のため `PUT` とする（追加ではなく上書き）。
        プリセットタグ一覧との照合は現状バックエンド側では行わない（未決定事項参照）。
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagsRequest"
            example:
              tags: ["AI", "京都"]
      responses:
        "204":
          description: 保存成功（本文なし）
        "400":
          description: "`tags` が空、4件以上、または要素が空文字列"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_TAGS
                  message: "tagsは1〜3件で指定してください"
        "404":
          description: "`userId` が存在しない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: USER_NOT_FOUND
                  message: "指定されたユーザーが見つかりません"

  /api/users/{userId}/programs/latest:
    get:
      operationId: getLatestProgram
      tags: [programs]
      summary: 最新の番組を取得する（ホーム）
      description: |
        その日（最新）の番組を取得する（[ホーム](../frontend/docs/features/home.md)）。
        バッチ処理（`POST /api/batch/run`）が生成した、その `userId` にとって
        最も新しい番組を返す。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: "userId が存在しない、または番組がまだ1件も生成されていない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                userNotFound:
                  summary: userId が存在しない
                  value:
                    error:
                      code: USER_NOT_FOUND
                      message: "指定されたユーザーが見つかりません"
                programNotFound:
                  summary: 番組が未生成（ホーム画面は「準備中」表示の分岐に使う）
                  value:
                    error:
                      code: PROGRAM_NOT_FOUND
                      message: "指定されたユーザーの番組がまだ生成されていません"

  /api/users/{userId}/programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: 過去の番組一覧を取得する（ホームの履歴）
      description: |
        ホーム画面の「履歴」セクション用。作成日時の降順で返す。個別記事の全文検索や
        ビッグデータ的な分析は行わない（[Requirements.md](../Requirements.md)のスコープ外参照）、
        あくまで直近の番組メタデータの一覧に限定した軽量なエンドポイント。

        各要素の `title` は、その番組内で最も重要度が高いチャプター（`position: 0`）の
        `title` をサーバー側でそのまま採用したもの（新たに番組全体の要約タイトルを
        生成するわけではない）。
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: 取得件数の上限
      responses:
        "200":
          description: "取得成功（1件も無ければ `items` は空配列）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramHistoryResponse"
        "404":
          description: "`userId` が存在しない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: USER_NOT_FOUND
                  message: "指定されたユーザーが見つかりません"

  /api/users/{userId}/programs/latest/regenerate:
    post:
      operationId: regenerateLatestProgram
      tags: [programs]
      summary: 今日の番組をリセットする（プロフィールの設定、新しい番組を1本追加生成する）
      description: |
        保存済みの `tags` / `lengthMinutes` を使って番組をもう1本生成し、履歴に追加する。

        **改訂**：以前は既存の最新番組を新しい生成結果で置き換える仕様だったが、
        「デモ用に番組をもう1本追加生成する」エンドポイント（`POST /api/users/{userId}/programs`、
        `createAdditionalProgram`）と実質的に同じ処理になったため統合し、こちらが正式な
        実装として残った（置き換えず追加する）。既存の最新番組は削除されない。
        `GET /api/users/{userId}/programs/latest` は作成日時が最も新しい番組を返すため、
        結果としてホーム画面に表示される番組はこの新しい番組に変わる。

        `POST /api/demo/generate` とは異なり、こちらは**永続化する**。パイプライン全体
        （記事取得→LLM→TTS）を再実行するため負荷が高く、**1ユーザーにつき1日3回まで**に
        制限する。回数は `users.reset_count` で管理し、`users.reset_date`（配信時刻を
        跨いだ日付）が変わった時点でサーバー側が自動的に0へリセットする
        （[06-storage.md](../backend/docs/pipeline/06-storage.md)参照）。

        同期実行のため、`POST /api/demo/generate` と同様にレスポンスまで数十秒〜数分程度
        かかる想定でタイムアウトを設定すること（サーバー側ハンドラのタイムアウトは10分）。

        **多重リクエストはリクエスト受信時点で即座に拒否する。** 同じ`userId`に対して
        生成処理が実行中の間に2回目のリクエストが来た場合、そのリクエストはパイプラインを
        起動せず`409`（`ALREADY_GENERATING`）を即返す（実装方針の詳細は
        [backend/docs/api-handlers.md](../backend/docs/api-handlers.md#regenerateの多重リクエスト防止)参照）。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: 生成成功。新しく追加された番組を返す
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: "`userId` が存在しない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: USER_NOT_FOUND
                  message: "指定されたユーザーが見つかりません"
        "409":
          description: 同じユーザーの作り直しリクエストがすでに処理中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ALREADY_GENERATING
                  message: "前回のリクエストを処理中です。しばらく待ってから再度お試しください"
        "429":
          description: 本日の上限（3回）に達している
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: RESET_LIMIT_EXCEEDED
                  message: "本日の作り直し回数の上限（3回）に達しています"
        "502":
          description: "外部プロバイダの呼び出し失敗（`POST /api/demo/generate`と同じ`UPSTREAM_*`のcode体系）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "記事キャッシュが利用できない（`POST /api/demo/generate`と同じ`ARTICLE_CACHE_EMPTY`/`NO_UNSEEN_ARTICLES`のcode体系）。この2エラーは`reset_count`を消費しない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/programs/{programId}:
    get:
      operationId: getProgram
      tags: [programs]
      summary: 指定した番組の詳細を取得する（プレイヤー）
      description: |
        指定した番組の詳細を取得する（[プレイヤー](../frontend/docs/features/player.md)）。
        レスポンス形式は `GET /api/users/{userId}/programs/latest` と同じ
        （`userId` に紐付かない直接アクセス用。ホームからプレイヤーへ遷移する際に番組IDで参照する）。
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: 番組が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: PROGRAM_NOT_FOUND
                  message: "指定された番組が見つかりません"

  /api/audio/{programId}/{chapterId}:
    get:
      operationId: getAudio
      tags: [audio]
      summary: 音声ファイルを配信する
      description: |
        実体は [⑦保存](../backend/docs/pipeline/06-storage.md) のローカルファイルシステムから読む。

        - VOICEVOXの出力がネイティブでWAVのため、フォーマット変換（MP3エンコード等）は
          MVPでは行わずWAVのまま配信する。ファイル容量は大きくなるが、追加の依存
          （ffmpeg等）を増やさずに済むトレードオフを取る
        - `Range` リクエストヘッダに対応する（`206 Partial Content`）。HTML5 `<audio>` の
          シーク操作が `Range` リクエストを送るため、これがないとシークバー操作で
          毎回頭出しになる
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - $ref: "#/components/parameters/ChapterId"
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: "bytes=0-"
      responses:
        "200":
          description: 音声ファイル本体
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "206":
          description: "部分レスポンス（`Range`ヘッダ指定時）"
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "404":
          description: "`chapters`テーブルに該当行はあるがファイルが物理的に存在しない場合を含む"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: AUDIO_NOT_FOUND
                  message: "音声ファイルが見つかりません"

  /api/demo/generate:
    post:
      operationId: generateDemoProgram
      tags: [demo]
      summary: デモ用の軽量パイプラインをその場で実行する
      description: |
        デモ用の軽量パイプラインをその場で実行する（記事数を絞った縮小版。
        [backend/CLAUDE.md](../backend/CLAUDE.md#デモ用の軽量パイプライン)参照）。

        **この呼び出しはDBに保存しない。** `programs`/`chapters`テーブルへの書き込みは行わず、
        生成した結果をレスポンスとしてその場で返すだけの一発実行。理由：`programs.user_id`は
        必須の外部キーだが、このエンドポイントは`userId`を受け取らない想定のライブデモ用途のため、
        永続化の対象外として設計をシンプルに保つ。

        レスポンスの `id` は、レスポンスを跨いで再利用できない一時的な値
        （`demo-` プレフィックス付きなど）を返す。音声ファイル自体は `AUDIO_STORAGE_PATH` 配下に
        一時保存し、`audioUrl` 経由で配信する（保存期間・掃除タイミングは未決定事項）。

        **同期実行・低いタイムアウト前提の注意**：記事取得→LLM→TTSを直列に呼ぶため、
        レスポンスまで数十秒〜数分程度かかる。フロントエンドはこの間ローディング状態を表示し、
        `fetch`のタイムアウトは余裕を持って（サーバー側ハンドラのタイムアウトである10分に）設定すること。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoGenerateRequest"
            example:
              tags: ["AI"]
      responses:
        "200":
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          description: "`tags`が空"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_TAGS
                  message: "tagsは1件以上指定してください"
        "503":
          description: |
            記事キャッシュが利用できない（[backend/docs/generation/03-selection.md]
            (../backend/docs/generation/03-selection.md)参照。記事取得はこの
            エンドポイントの呼び出し時ではなく、事前に別ジョブ（`cmd/ingest`）が
            RSSフィードから収集・キャッシュしておく方式に変更されたため、
            `UPSTREAM_FETCH_FAILED`はこのエンドポイントでは発生しなくなった）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                cacheEmpty:
                  summary: 該当タグの記事がキャッシュに1件も無い（収集ジョブ未実行・対象タグの記事が未収集）
                  value:
                    error:
                      code: ARTICLE_CACHE_EMPTY
                      message: "利用できる新着記事がまだ収集されていません"
                noUnseenArticles:
                  summary: キャッシュに記事はあるが、直近14日以内の新しい話題が無い
                  value:
                    error:
                      code: NO_UNSEEN_ARTICLES
                      message: "未配信の新着記事がありません"
        "502":
          description: 外部プロバイダの呼び出し失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                llmFailed:
                  summary: Gemini API呼び出し失敗・レート制限
                  value:
                    error:
                      code: UPSTREAM_LLM_FAILED
                      message: "台本生成に失敗しました"
                ttsFailed:
                  summary: VOICEVOX ENGINEへの接続失敗
                  value:
                    error:
                      code: UPSTREAM_TTS_FAILED
                      message: "音声生成に失敗しました"

  /api/batch/run:
    post:
      operationId: runBatch
      tags: [batch]
      summary: 毎朝のバッチ処理を起動する
      description: |
        毎朝6:00相当のバッチ処理をローカルのcron/手動実行から叩くためのエンドポイント
        （[backend/CLAUDE.md](../backend/CLAUDE.md#バッチ実行)参照）。全ユーザー分の番組を生成し、
        `programs`/`chapters`に保存する（`POST /api/demo/generate`とは異なり、こちらは永続化する）。

        **進捗確認手段はMVPでは提供しない**：`202`を返した後、各ユーザーの生成完了は個別に
        `GET /api/users/{userId}/programs/latest`をポーリングして`createdAt`の更新を見るしかない。
        バッチ全体の完了通知や失敗ユーザーの一覧化は行わない（ハッカソン規模ではオーバースペックと判断）。

        **想定される呼び出し元はローカルのcron／開発者本人のみ**：認証を行わないため、
        外部に公開しない前提（CORSの許可オリジンにも含めない）。
      responses:
        "202":
          description: 受理成功（非同期実行のため、このレスポンスは受理のみを示す）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchRunResponse"

  /api/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: ヘルスチェック
      description: |
        `docker compose up`後、Postgres・VOICEVOX ENGINEへの接続確認も含めたヘルスチェック。
        フロントエンド起動前の疎通確認や、開発時の動作確認に使う。
      responses:
        "200":
          description: 全て正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                postgres: ok
                voicevox: ok
        "503":
          description: いずれかに接続できない（該当箇所を"error"にして返す）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: error
                postgres: ok
                voicevox: error

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: "サーバー内部でエラーが発生しました"

  schemas:
    CreateUserResponse:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    TagsRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
          description: 1〜3件の文字列配列

    DemoGenerateRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          minItems: 1
          items:
            type: string

    BatchRunResponse:
      type: object
      required: [acceptedAt]
      properties:
        acceptedAt:
          type: string
          format: date-time
          example: "2026-08-29T06:00:00+09:00"

    HealthResponse:
      type: object
      required: [status, postgres, voicevox]
      properties:
        status:
          type: string
          enum: [ok, error]
        postgres:
          type: string
          enum: [ok, error]
        voicevox:
          type: string
          enum: [ok, error]

    Program:
      type: object
      required: [id, title, createdAt, greetingText, changeCount, totalDurationSec, chapters]
      properties:
        id:
          type: string
          format: uuid
          example: 8f14e45f-ceea-4c9e-8b52-1c4d5d5f6a12
        title:
          type: string
          description: |
            番組の代表タイトル。最も重要度が高いチャプター（`position: 0`）の`title`を
            サーバー側でそのまま流用したもの（番組全体を要約する専用のタイトルを
            別途生成するわけではない）。ホームの履歴一覧・プレイヤーの見出しに使う
          example: "AI開発の新モデルが発表、性能が前世代比2倍に"
        createdAt:
          type: string
          format: date-time
          example: "2026-08-29T06:00:00+09:00"
        greetingText:
          type: string
          description: |
            番組冒頭の挨拶文（台本の書き出しと同じ文面）。ホーム画面の
            「ゲストさん、おはようございます。」に続けて表示する本文パート。
            ユーザーの表示名はクライアントローカルの値のため、このテキストには含まない
            （本ファイル冒頭「表示名（ニックネーム）の扱い」参照）
          example: "今日はAI関連で3件、動きがあります。"
        changeCount:
          type: integer
          description: |
            前日の番組からの差分件数（新規・更新されたトピック数）。`chapters.length`とは
            別概念。`demo/generate`以外（キャッシュ経由の生成）では
            [03-selection.md](../backend/docs/generation/03-selection.md)の選択ロジックが、
            `demo/generate`（ライブfetch経路）では重要度判定ステップ
            （[03-score.md](../backend/docs/pipeline/03-score.md)）が算出する。
            ホーム画面の「今日はn件、動きがあります」の`n`に対応
          example: 3
        totalDurationSec:
          type: integer
          description: 番組合計の再生時間（秒）
          example: 420
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"

    Chapter:
      type: object
      required:
        - id
        - position
        - title
        - sourceUrl
        - sourceName
        - script
        - audioUrl
        - durationSec
      properties:
        id:
          type: string
          format: uuid
          example: c56a4180-65aa-42ec-a945-5fd21dec0538
        position:
          type: integer
          description: 番組内の並び順
          example: 0
        title:
          type: string
          example: "〇〇について"
        sourceUrl:
          type: string
          format: uri
          example: https://example.com/article
        sourceName:
          type: string
          example: Example News
        script:
          type: string
          description: |
            このチャプターの読み上げ台本全文（[04-script.md](../backend/docs/pipeline/04-script.md)で
            生成されたもの、`chapters.script`カラムに対応）。プレイヤー画面でSpotifyの歌詞表示のように
            現在の読み上げ箇所をハイライトする用途に使う。

            **注意：文単位のタイムスタンプは持たない。** 台本と音声を強制アライメントする仕組みは
            現状のパイプラインに無いため、クライアント側は音声の再生位置（`durationSec`に対する
            経過秒数の比率）から表示行を按分計算する、疑似的な同期にとどまる
            （厳密な同期は未決定事項参照）。改行区切りの複数文からなる
          example: "まず注目は新しい言語モデルの発表です。\n前世代と比べて推論速度が2倍になったとのことです。"
        audioUrl:
          type: string
          example: /api/audio/8f14e45f-ceea-4c9e-8b52-1c4d5d5f6a12/c56a4180-65aa-42ec-a945-5fd21dec0538
        durationSec:
          type: integer
          description: |
            チャプター単体の再生時間（秒）。プレイヤーのシークバー初期表示に使う
            （`<audio>`のメタデータ読み込み完了を待たずに表示できるようにするため）
          example: 95

    UserProfile:
      type: object
      required: [userId, tags, deliveryTime, lengthMinutes, resetsUsedToday, resetsLimitPerDay, stats]
      properties:
        userId:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
          example: ["AI", "京都"]
        deliveryTime:
          type: string
          description: "`HH:MM`形式（24時間表記）"
          example: "06:00"
        lengthMinutes:
          type: integer
          enum: [5, 10, 15]
          example: 10
        resetsUsedToday:
          type: integer
          description: "本日`POST /api/users/{userId}/programs/latest/regenerate`を呼んだ回数"
          example: 0
        resetsLimitPerDay:
          type: integer
          description: 1日あたりの作り直し上限（固定値・現状3）
          example: 3
        stats:
          type: object
          required: [totalPrograms, totalDurationSec]
          properties:
            totalPrograms:
              type: integer
              description: これまでに生成された番組数（全期間）
              example: 12
            totalDurationSec:
              type: integer
              description: |
                生成された番組の合計収録時間（秒）。実際に聴取した時間の計測（再生イベントの
                トラッキング）は行っていないため「合計再生分数」ではなく収録時間の合計である点に注意
              example: 8880

    SettingsRequest:
      type: object
      required: [deliveryTime, lengthMinutes]
      properties:
        deliveryTime:
          type: string
          description: "`HH:MM`形式（24時間表記）"
          example: "06:00"
        lengthMinutes:
          type: integer
          enum: [5, 10, 15]
          example: 10

    ProgramSummary:
      type: object
      required: [id, title, createdAt, totalDurationSec]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "円安基調が継続、輸出企業への影響は"
        createdAt:
          type: string
          format: date-time
        totalDurationSec:
          type: integer
          example: 660

    ProgramHistoryResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgramSummary"
        total:
          type: integer
          description: 条件に合致する全件数（`limit`で切られる前の総数）
          example: 12

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: "`SCREAMING_SNAKE_CASE`の固定文字列"
              enum:
                - USER_NOT_FOUND
                - INVALID_TAGS
                - INVALID_SETTINGS
                - PROGRAM_NOT_FOUND
                - AUDIO_NOT_FOUND
                - ALREADY_GENERATING
                - RESET_LIMIT_EXCEEDED
                - ARTICLE_CACHE_EMPTY
                - NO_UNSEEN_ARTICLES
                - UPSTREAM_LLM_FAILED
                - UPSTREAM_TTS_FAILED
                - DEMO_MODE_DISABLED
                - INTERNAL_ERROR
            message:
              type: string

x-open-questions:
  - "プリセットタグ一覧の管理場所（フロントエンドのハードコード／バックエンドでマスタ管理）と、`PUT /api/users/{userId}/tags`でのバリデーション有無"
  - "`POST /api/demo/generate`が一時保存する音声ファイルの掃除タイミング（TTL／起動時クリーンアップ等）"
  - "`POST /api/batch/run`の同時実行防止（多重起動をどう防ぐか。ロックファイル／DBフラグ等）"
  - "`Chapter.script`の文単位タイムスタンプ（真のカラオケ風同期表示をやるなら、VOICEVOXのモーラ単位タイミングを使ったアライメント生成が必要。MVPでは`durationSec`からの按分表示で妥協している）"
  - "波形シークバーの実データ化（現状UIモックは疑似ランダムな波形を描画しているだけで、実際の音声波形ピーク値をAPIから返す仕組みは無い。`Chapter`に`waveformPeaks: number[]`を追加するかどうか）"
